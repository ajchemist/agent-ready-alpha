name: cc-maintenance

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  maintain-cc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Make the generator executable
        run: chmod +x .github/scripts/create-cc-branch.sh

      - name: Create or update the cc branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
          OMNIROUTE_URL: ${{ vars.OMNIROUTE_URL }}
          OMNIROUTE_VERDICT: ${{ vars.OMNIROUTE_VERDICT }}
        run: .github/scripts/create-cc-branch.sh

      - name: Create audit issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const commitSha = fs.existsSync('cc_commit_sha') ? fs.readFileSync('cc_commit_sha', 'utf8').trim() : 'unknown';
            const title = `cc maintenance audit ${new Date().toISOString()}`;
            const body = [
              'cc branch maintenance run completed.',
              '',
              `- Commit SHA: ${commitSha}`,
              `- Workflow: ${context.workflow}`,
              `- Run URL: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['cc-maintenance']
            });
